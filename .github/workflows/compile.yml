name: Build Vita Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Manually Map taiHEN Headers and Libraries
        run: |
          git clone https://github.com /tmp/taihen
          cp -r /tmp/taihen/libtaihen/include/* /usr/local/vitasdk/arm-vita-eabi/include/
          # Generate placeholder stub to satisfy linker criteria cleanly
          arm-vita-eabi-ar rcs /usr/local/vitasdk/arm-vita-eabi/lib/libtaihen.a

      - name: Create Build Environment
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake ..
          make

      - name: Upload Finished Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fifa14_redirect_suprx
          path: build/*.suprx
