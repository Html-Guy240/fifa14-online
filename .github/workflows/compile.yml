name: Build Vita Plugin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Install taiHEN Framework Dependencies
        run: |
          # Fix the URL spacing and clone the official repository library layout
          git clone https://github.com /tmp/taihen
          
          # Copy headers to the Vita SDK system directory paths
          cp -r /tmp/taihen/libtaihen/include/* /usr/local/vitasdk/arm-vita-eabi/include/
          
          # Generate the local archive library file to satisfy -ltaihen linker flags
          arm-vita-eabi-ar rcs /usr/local/vitasdk/arm-vita-eabi/lib/libtaihen.a

      - name: Create Build Environment
        run: |
          mkdir build
          cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${VITASDK}/share/vita.toolchain.cmake ..
          make

      - name: Upload Finished Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fifa14_redirect_suprx
          path: build/*.suprx
